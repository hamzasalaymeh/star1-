*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Georgia','Times New Roman',serif;cursor:none}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
#cursor{position:fixed;width:20px;height:20px;border-radius:50%;pointer-events:none;z-index:10000;mix-blend-mode:screen;transition:transform .15s ease,opacity .15s ease;background:radial-gradient(circle,rgba(255,220,150,.8),rgba(255,180,100,.2),transparent 70%)}
#cursor-trail{position:fixed;width:40px;height:40px;border-radius:50%;pointer-events:none;z-index:9999;background:radial-gradient(circle,rgba(255,200,100,.15),transparent 70%);transition:transform .3s ease}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9998;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:1;transition:opacity 2s ease}
#loading.hidden{opacity:0;pointer-events:none}
#loading-text{color:rgba(255,220,180,.6);font-size:14px;letter-spacing:8px;text-transform:uppercase}
#loading-bar{width:200px;height:1px;background:rgba(255,255,255,.1);margin-top:20px;position:relative;overflow:hidden}
#loading-fill{width:0%;height:100%;background:linear-gradient(90deg,rgba(255,200,100,.3),rgba(255,220,150,.8));transition:width .3s ease}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;pointer-events:none}
#vignette{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%);z-index:99;pointer-events:none}
.message-card{position:fixed;z-index:200;padding:30px 40px;background:rgba(10,10,30,.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,220,150,.15);border-radius:16px;color:rgba(255,240,220,.9);font-size:18px;line-height:1.8;letter-spacing:1px;max-width:500px;opacity:0;transform:translateY(20px) scale(.95);transition:all .8s cubic-bezier(.23,1,.32,1);pointer-events:none;text-align:center;box-shadow:0 0 60px rgba(255,200,100,.05),inset 0 0 60px rgba(255,200,100,.02)}
.message-card.visible{opacity:1;transform:translateY(0) scale(1)}
#cinematic-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:150;color:rgba(255,240,220,.9);font-size:24px;letter-spacing:3px;line-height:2;text-align:center;opacity:0;pointer-events:none;text-shadow:0 0 40px rgba(255,200,100,.3)}
#mute-btn{position:fixed;bottom:30px;right:30px;z-index:300;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);backdrop-filter:blur(10px);color:rgba(255,255,255,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .3s ease;pointer-events:all}
#mute-btn:hover{border-color:rgba(255,220,150,.4);color:rgba(255,220,150,.8)}
#scene-indicator{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:300;display:flex;gap:8px}
.scene-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);transition:all .5s ease}
.scene-dot.active{background:rgba(255,220,150,.6);box-shadow:0 0 10px rgba(255,200,100,.3)}
#click-hint{position:fixed;bottom:50%;left:50%;transform:translate(-50%,50%);z-index:200;color:rgba(255,255,255,.3);font-size:12px;letter-spacing:4px;opacity:0;pointer-events:none;text-transform:uppercase}

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.1/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ═══════════════════════════════════════════════════════
// AUDIO ENGINE
// ═══════════════════════════════════════════════════════
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = false;
    this.initialized = false;
    this.heartbeatInterval = null;
  }

  init() {
    if (this.initialized) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(this.ctx.destination);
    this.initialized = true;
    this.master.gain.linearRampToValueAtTime(0.3, this.ctx.currentTime + 2);
  }

  createOscPad(freq, type = 'sine', gain = 0.03, detune = 0) {
    if (!this.ctx) return null;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.detune.value = detune;
    g.gain.value = gain;
    osc.connect(g);
    g.connect(this.master);
    osc.start();
    return { osc, gain: g };
  }

  playHeartbeat(intensity = 0.15) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 40;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(intensity, now + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.connect(g);
    g.connect(this.master);
    osc.start(now);
    osc.stop(now + 0.5);
  }

  playTone(freq, duration = 1, gain = 0.05, type = 'sine') {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    const reverb = this.ctx.createConvolver();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(gain, now + 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(g);
    g.connect(this.master);
    osc.start(now);
    osc.stop(now + duration);
  }

  startAmbientDrone() {
    if (!this.ctx) return;
    this.createOscPad(55, 'sine', 0.02);
    this.createOscPad(55.3, 'sine', 0.015, 5);
    this.createOscPad(82.5, 'sine', 0.01);
    this.createOscPad(110, 'triangle', 0.005, -3);
    this.createOscPad(165, 'sine', 0.003);
    this.createOscPad(220, 'sine', 0.002, 7);
  }

  playChime(notes = [523, 659, 784], delay = 0.15) {
    if (!this.ctx) return;
    notes.forEach((freq, i) => {
      setTimeout(() => this.playTone(freq, 2, 0.04, 'sine'), i * delay * 1000);
    });
  }

  playSupernova() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const noise = this.ctx.createBufferSource();
    const buf = this.ctx.createBuffer(2, this.ctx.sampleRate * 4, this.ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < d.length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 1.5));
      }
    }
    noise.buffer = buf;
    const g = this.ctx.createGain();
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 200;
    lp.frequency.linearRampToValueAtTime(2000, now + 0.5);
    lp.frequency.linearRampToValueAtTime(100, now + 3);
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.2, now + 0.3);
    g.gain.exponentialRampToValueAtTime(0.001, now + 4);
    noise.connect(lp);
    lp.connect(g);
    g.connect(this.master);
    noise.start(now);
    this.playTone(30, 4, 0.15, 'sine');
    this.playTone(55, 3, 0.08, 'sine');
  }

  playFinaleMusic() {
    if (!this.ctx) return;
    const melody = [261.6, 329.6, 392, 523.3, 659.3, 784, 1047, 784, 659.3, 523.3];
    melody.forEach((freq, i) => {
      setTimeout(() => this.playTone(freq, 3, 0.04, 'sine'), i * 600);
    });
    this.playTone(130.8, 8, 0.03, 'sine');
    this.playTone(196, 8, 0.02, 'sine');
  }

  toggleMute() {
    if (!this.master) return;
    this.muted = !this.muted;
    this.master.gain.linearRampToValueAtTime(this.muted ? 0 : 0.3, this.ctx.currentTime + 0.3);
  }
}

// ═══════════════════════════════════════════════════════
// SHADER DEFINITIONS
// ═══════════════════════════════════════════════════════
const nebulaVertexShader = `
varying vec2 vUv;
varying vec3 vPosition;
void main() {
  vUv = uv;
  vPosition = position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

const nebulaFragmentShader = `
uniform float uTime;
uniform vec3 uColor1;
uniform vec3 uColor2;
uniform vec3 uColor3;
uniform float uOpacity;
varying vec2 vUv;
varying vec3 vPosition;

vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284-0.85373*r;}

float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);
  const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.;
  vec4 s1=floor(b1)*2.+1.;
  vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);
  m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

void main() {
  float n1 = snoise(vPosition * 0.3 + uTime * 0.05);
  float n2 = snoise(vPosition * 0.6 + uTime * 0.08 + 100.0);
  float n3 = snoise(vPosition * 1.2 + uTime * 0.03 + 200.0);
  float noise = (n1 + n2 * 0.5 + n3 * 0.25) / 1.75;
  noise = noise * 0.5 + 0.5;
  vec3 color = mix(uColor1, uColor2, noise);
  color = mix(color, uColor3, n3 * 0.5 + 0.5);
  float edge = smoothstep(0.0, 0.3, vUv.x) * smoothstep(1.0, 0.7, vUv.x) *
               smoothstep(0.0, 0.3, vUv.y) * smoothstep(1.0, 0.7, vUv.y);
  float alpha = noise * edge * uOpacity * 0.6;
  gl_FragColor = vec4(color, alpha);
}`;

const godRayShader = {
  uniforms: {
    tDiffuse: { value: null },
    uLightPos: { value: new THREE.Vector2(0.5, 0.5) },
    uExposure: { value: 0.15 },
    uDecay: { value: 0.96 },
    uDensity: { value: 0.8 },
    uWeight: { value: 0.4 },
    uSamples: { value: 60 }
  },
  vertexShader: `varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 uLightPos;
    uniform float uExposure;
    uniform float uDecay;
    uniform float uDensity;
    uniform float uWeight;
    uniform int uSamples;
    varying vec2 vUv;
    void main(){
      vec2 d=vUv-uLightPos;
      d*=1./float(uSamples)*uDensity;
      vec2 coord=vUv;
      vec4 col=vec4(0.);
      float il=1.;
      for(int i=0;i<60;i++){
        coord-=d;
        vec4 s=texture2D(tDiffuse,clamp(coord,0.,1.));
        s*=il*uWeight;
        col+=s;
        il*=uDecay;
      }
      col*=uExposure;
      vec4 orig=texture2D(tDiffuse,vUv);
      gl_FragColor=orig+col;
    }`
};

const chromaticAberrationShader = {
  uniforms: {
    tDiffuse: { value: null },
    uIntensity: { value: 0.002 },
    uTime: { value: 0 }
  },
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uIntensity;
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      vec2 dir=vUv-0.5;
      float d=length(dir);
      float i=uIntensity*(1.+sin(uTime*0.5)*0.2);
      float r=texture2D(tDiffuse,vUv+dir*d*i).r;
      float g=texture2D(tDiffuse,vUv).g;
      float b=texture2D(tDiffuse,vUv-dir*d*i).b;
      gl_FragColor=vec4(r,g,b,1.);
    }`
};

const vignetteShader = {
  uniforms: {
    tDiffuse: { value: null },
    uDarkness: { value: 0.6 },
    uOffset: { value: 1.0 }
  },
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uDarkness;
    uniform float uOffset;
    varying vec2 vUv;
    void main(){
      vec4 c=texture2D(tDiffuse,vUv);
      vec2 uv=(vUv-0.5)*2.0;
      float v=1.-dot(uv,uv)*uDarkness;
      v=clamp(v,0.,1.);
      gl_FragColor=vec4(c.rgb*v,c.a);
    }`
};

// ═══════════════════════════════════════════════════════
// MAIN APPLICATION
// ═══════════════════════════════════════════════════════
class GhadaUniverse {
  constructor() {
    this.clock = new THREE.Clock();
    this.mouse = new THREE.Vector2();
    this.mouseSmooth = new THREE.Vector2();
    this.raycaster = new THREE.Raycaster();
    this.audio = new AudioEngine();
    this.scene = null;
    this.camera = null;
    this.renderer = null;
    this.composer = null;
    this.bloomPass = null;
    this.starField = null;
    this.nebulae = [];
    this.planets = [];
    this.particles = [];
    this.cosmicObjects = [];
    this.currentScene = 0;
    this.sceneProgress = 0;
    this.scrollProgress = 0;
    this.totalScenes = 12;
    this.started = false;
    this.introComplete = false;
    this.supernovaTriggered = false;
    this.finaleStarted = false;
    this.messageCards = [];
    this.activeCard = null;
    this.cameraPath = [];
    this.cameraProgress = 0;
    this.breathPhase = 0;
    this.timeScale = 1;
    this.width = window.innerWidth;
    this.height = window.innerHeight;
    this.dpr = Math.min(window.devicePixelRatio, 2);
    this.isMobile = /Mobi|Android/i.test(navigator.userAgent);

    this.quotes = [
      "When the universe was born...\nit didn't know it was creating beauty.",
      "There are places even light\nneeds time to reach.",
      "Every star carries a story.",
      "Silence is where\nthe universe speaks.",
      "Some lights shine long after\nthey disappear.",
      "Infinity is measured by wonder.",
      "The universe remembers\nevery spark.",
      "Not every miracle makes a sound.",
      "There are billions of stars...\nyet sometimes only one\ncaptures your eyes.",
      "The most beautiful things\nnever ask to be noticed.",
      "Some souls feel strangely familiar...\neven across galaxies.",
      "Some lights don't guide the way...\nthey become the destination.",
      "The universe never creates\ntwo identical stars.",
      "Some names deserve to be written\nacross the sky."
    ];
    this.currentQuoteIndex = 0;
    this.ghadaNameGroup = null;
    this.roseGroup = null;
    this.eyeGroup = null;
    this.treeGroup = null;
    this.oceanGroup = null;
    this.blackHoleGroup = null;
  }

  async init() {
    this.setupRenderer();
    this.setupCamera();
    this.setupScene();
    this.setupPostProcessing();
    this.setupEvents();
    this.setupCursor();

    await this.buildUniverse();
    this.hideLoading();
    this.animate();
  }

  setupRenderer() {
    this.renderer = new THREE.WebGLRenderer({
      antialias: !this.isMobile,
      alpha: false,
      powerPreference: 'high-performance'
    });
    this.renderer.setSize(this.width, this.height);
    this.renderer.setPixelRatio(this.dpr);
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 0.8;
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(this.renderer.domElement);
  }

  setupCamera() {
    this.camera = new THREE.PerspectiveCamera(60, this.width / this.height, 0.1, 20000);
    this.camera.position.set(0, 0, 5);
  }

  setupScene() {
    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.FogExp2(0x000005, 0.00008);
  }

  setupPostProcessing() {
    this.composer = new EffectComposer(this.renderer);
    const renderPass = new RenderPass(this.scene, this.camera);
    this.composer.addPass(renderPass);

    this.bloomPass = new UnrealBloomPass(
      new THREE.Vector2(this.width, this.height),
      1.2, 0.6, 0.2
    );
    this.composer.addPass(this.bloomPass);

    const godRayPass = new ShaderPass(godRayShader);
    this.composer.addPass(godRayPass);
    this.godRayPass = godRayPass;

    const chromaticPass = new ShaderPass(chromaticAberrationShader);
    this.composer.addPass(chromaticPass);
    this.chromaticPass = chromaticPass;

    const vignettePass = new ShaderPass(vignetteShader);
    this.composer.addPass(vignettePass);
  }

  setupEvents() {
    window.addEventListener('resize', () => this.onResize());
    window.addEventListener('mousemove', (e) => this.onMouseMove(e));
    window.addEventListener('touchmove', (e) => this.onTouchMove(e), { passive: true });
    window.addEventListener('wheel', (e) => this.onWheel(e), { passive: true });
    window.addEventListener('click', (e) => this.onClick(e));
    window.addEventListener('touchstart', (e) => this.onTouchStart(e), { passive: true });

    document.getElementById('mute-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      this.audio.toggleMute();
      e.target.textContent = this.audio.muted ? '♪̸' : '♪';
    });
  }

  setupCursor() {
    const cursor = document.getElementById('cursor');
    const trail = document.getElementById('cursor-trail');
    document.addEventListener('mousemove', (e) => {
      cursor.style.transform = `translate(${e.clientX - 10}px, ${e.clientY - 10}px)`;
      trail.style.transform = `translate(${e.clientX - 20}px, ${e.clientY - 20}px)`;
    });
    if (this.isMobile) {
      cursor.style.display = 'none';
      trail.style.display = 'none';
      document.body.style.cursor = 'auto';
    }
  }

  onResize() {
    this.width = window.innerWidth;
    this.height = window.innerHeight;
    this.camera.aspect = this.width / this.height;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(this.width, this.height);
    this.composer.setSize(this.width, this.height);
  }

  onMouseMove(e) {
    this.mouse.x = (e.clientX / this.width) * 2 - 1;
    this.mouse.y = -(e.clientY / this.height) * 2 + 1;
  }

  onTouchMove(e) {
    if (e.touches.length > 0) {
      this.mouse.x = (e.touches[0].clientX / this.width) * 2 - 1;
      this.mouse.y = -(e.touches[0].clientY / this.height) * 2 + 1;
    }
  }

  onWheel(e) {
    if (!this.introComplete) return;
    this.scrollProgress += e.deltaY * 0.0003;
    this.scrollProgress = Math.max(0, Math.min(1, this.scrollProgress));
  }

  onClick(e) {
    if (!this.started) {
      this.startExperience();
      return;
    }
  }

  onTouchStart(e) {
    if (!this.started) {
      this.startExperience();
    }
  }

  // ═══════════════════════════════════════════════════
  // UNIVERSE BUILDING
  // ═══════════════════════════════════════════════════
  async buildUniverse() {
    this.updateLoading(10);
    this.createStarField();
    this.updateLoading(30);
    this.createDeepStars();
    this.updateLoading(45);
    this.createNebulae();
    this.updateLoading(55);
    this.createGalaxies();
    this.updateLoading(65);
    this.createPlanets();
    this.updateLoading(72);
    this.createCosmicDust();
    this.updateLoading(78);
    this.createBlackHole();
    this.updateLoading(82);
    this.createCosmicTree();
    this.updateLoading(86);
    this.createCosmicOcean();
    this.updateLoading(90);
    this.createGhadaName();
    this.updateLoading(94);
    this.createCosmicRose();
    this.updateLoading(96);
    this.createCelestialEye();
    this.updateLoading(98);
    this.createIntroStar();
    this.updateLoading(100);
  }

  updateLoading(pct) {
    document.getElementById('loading-fill').style.width = pct + '%';
  }

  hideLoading() {
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('click-hint').style.opacity = '1';
      document.getElementById('click-hint').style.transition = 'opacity 2s ease';
    }, 500);
  }

  createIntroStar() {
    const geo = new THREE.SphereGeometry(0.05, 32, 32);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffeedd, transparent: true, opacity: 0 });
    this.introStar = new THREE.Mesh(geo, mat);
    this.introStar.position.set(0, 0, 0);
    this.scene.add(this.introStar);

    const glowGeo = new THREE.SphereGeometry(0.15, 16, 16);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0xffcc88,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    this.introGlow = new THREE.Mesh(glowGeo, glowMat);
    this.introStar.add(this.introGlow);

    this.introParticles = this.createParticleSystem(200, 0.5, 0xffeedd);
    this.introParticles.visible = false;
    this.scene.add(this.introParticles);
  }

  createParticleSystem(count, radius, color) {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    const alphas = new Float32Array(count);

    for (let i = 0; i < count; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = Math.random() * radius;
      pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      pos[i * 3 + 2] = r * Math.cos(phi);
      sizes[i] = Math.random() * 3 + 1;
      alphas[i] = Math.random();
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    geo.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));

    const mat = new THREE.PointsMaterial({
      color: color,
      size: 0.02,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true
    });

    return new THREE.Points(geo, mat);
  }

  createStarField() {
    const starCount = this.isMobile ? 150000 : 320000;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(starCount * 3);
    const colors = new Float32Array(starCount * 3);
    const sizes = new Float32Array(starCount);

    const starColors = [
      new THREE.Color(0xfff8f0),
      new THREE.Color(0xffe4c4),
      new THREE.Color(0xffd700),
      new THREE.Color(0xadd8e6),
      new THREE.Color(0x87ceeb),
      new THREE.Color(0xff6b6b),
      new THREE.Color(0xdda0dd),
      new THREE.Color(0xffffff),
      new THREE.Color(0xffe0b2),
      new THREE.Color(0xb0c4de)
    ];

    for (let i = 0; i < starCount; i++) {
      const r = 50 + Math.random() * 8000;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);

      pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) * 0.4;
      pos[i * 3 + 2] = r * Math.cos(phi);

      const c = starColors[Math.floor(Math.random() * starColors.length)];
      const brightness = 0.5 + Math.random() * 0.5;
      colors[i * 3] = c.r * brightness;
      colors[i * 3 + 1] = c.g * brightness;
      colors[i * 3 + 2] = c.b * brightness;

      sizes[i] = Math.random() < 0.01 ? Math.random() * 4 + 2 : Math.random() * 1.5 + 0.3;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const mat = new THREE.PointsMaterial({
      size: 0.8,
      vertexColors: true,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true
    });

    this.starField = new THREE.Points(geo, mat);
    this.starField.visible = false;
    this.scene.add(this.starField);
  }

  createDeepStars() {

    for (let i = 0; i < count; i++) {
      const r = 100 + Math.random() * 10000;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      pos[i * 3 + 2] = r * Math.cos(phi);
      const b = 0.2 + Math.random() * 0.3;
      colors[i * 3] = b;
      colors[i * 3 + 1] = b * 0.9;
      colors[i * 3 + 2] = b * 1.1;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({
      size: 0.3,
      vertexColors: true,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    this.deepStars = new THREE.Points(geo, mat);
    this.deepStars.visible = false;
    this.scene.add(this.deepStars);
  }

  createNebulae() {
    const configs = [
      { pos: [200, 50, -400], scale: 250, c1: 0x330066, c2: 0x660033, c3: 0x110044 },
      { pos: [-300, -100, -600], scale: 300, c1: 0x003366, c2: 0x006633, c3: 0x001133 },
      { pos: [500, 200, -800], scale: 350, c1: 0x663300, c2: 0x993300, c3: 0x331100 },
      { pos: [-100, -200, -300], scale: 200, c1: 0x330033, c2: 0x660066, c3: 0x220022 },
      { pos: [0, 100, -500], scale: 280, c1: 0x003344, c2: 0x005566, c3: 0x001122 }
    ];

    configs.forEach(cfg => {
      const geo = new THREE.PlaneGeometry(cfg.scale, cfg.scale, 1, 1);
      const mat = new THREE.ShaderMaterial({
        vertexShader: nebulaVertexShader,
        fragmentShader: nebulaFragmentShader,
        uniforms: {
          uTime: { value: 0 },
          uColor1: { value: new THREE.Color(cfg.c1) },
          uColor2: { value: new THREE.Color(cfg.c2) },
          uColor3: { value: new THREE.Color(cfg.c3) },
          uOpacity: { value: 0 }
        },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(...cfg.pos);
      mesh.lookAt(0, 0, 0);
      mesh.visible = false;
      this.scene.add(mesh);
      this.nebulae.push(mesh);
    });
  }

  createGalaxies() {
    const createGalaxy = (pos, count, radius, color1, color2, tilt) => {
      const group = new THREE.Group();
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      const c1 = new THREE.Color(color1);
      const c2 = new THREE.Color(color2);

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const arm = Math.floor(Math.random() * 4);
        const armAngle = (arm / 4) * Math.PI * 2;
        const dist = Math.random() * radius;
        const spiral = dist * 0.003;

        const x = Math.cos(angle + armAngle + spiral) * dist + (Math.random() - 0.5) * dist * 0.15;
        const y = (Math.random() - 0.5) * dist * 0.05;
        const z = Math.sin(angle + armAngle + spiral) * dist + (Math.random() - 0.5) * dist * 0.15;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const t = dist / radius;
        const c = new THREE.Color().lerpColors(c1, c2, t);
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: 0.6,
        vertexColors: true,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true
      });

      const points = new THREE.Points(geo, mat);
      group.add(points);
      group.position.set(...pos);
      group.rotation.x = tilt;
      group.visible = false;
      group.userData.mat = mat;
      this.scene.add(group);
      this.cosmicObjects.push(group);
      return group;
    };

    createGalaxy([400, 0, -600], 40000, 150, 0xffcc88, 0x4488ff, 0.5);
    createGalaxy([-500, 100, -800], 30000, 120, 0xff8866, 0x8866ff, -0.3);
    createGalaxy([0, -200, -1000], 50000, 200, 0xffddaa, 0x66aaff, 0.8);
  }

  createPlanets() {
    const planetConfigs = [
      { pos: [80, 20, -150], r: 8, color: 0x4488cc, emissive: 0x112244, ring: true },
      { pos: [-120, -30, -250], r: 12, color: 0xcc8844, emissive: 0x442211, ring: false },
      { pos: [200, 60, -350], r: 6, color: 0x88cc88, emissive: 0x114411, ring: true },
      { pos: [-60, 40, -180], r: 4, color: 0xddaaff, emissive: 0x331144, ring: false },
      { pos: [150, -50, -280], r: 15, color: 0xcc6644, emissive: 0x441111, ring: true },
      { pos: [-200, 80, -400], r: 10, color: 0x4466cc, emissive: 0x111133, ring: false },
      { pos: [50, -80, -200], r: 5, color: 0xffdd88, emissive: 0x443300, ring: false }
    ];

    planetConfigs.forEach(cfg => {
      const geo = new THREE.SphereGeometry(cfg.r, 64, 64);
      const mat = new THREE.MeshStandardMaterial({
        color: cfg.color,
        emissive: cfg.emissive,
        emissiveIntensity: 0.3,
        roughness: 0.7,
        metalness: 0.2
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(...cfg.pos);
      mesh.visible = false;
      this.scene.add(mesh);
      this.planets.push(mesh);

      if (cfg.ring) {
        const ringGeo = new THREE.RingGeometry(cfg.r * 1.3, cfg.r * 2, 64);
        const ringMat = new THREE.MeshBasicMaterial({
          color: cfg.color,
          transparent: true,
          opacity: 0.3,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2.5;
        mesh.add(ring);
      }

      const light = new THREE.PointLight(cfg.color, 0, cfg.r * 10);
      mesh.add(light);
    });

    const ambientLight = new THREE.AmbientLight(0x111122, 0.5);
    this.scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffeedd, 0.3);
    dirLight.position.set(100, 100, 50);
    this.scene.add(dirLight);
  }

    const pos = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      pos[i * 3] = (Math.random() - 0.5) * 2000;
      pos[i * 3 + 1] = (Math.random() - 0.5) * 500;
      pos[i * 3 + 2] = (Math.random() - 0.5) * 2000;
      const g = 0.3 + Math.random() * 0.2;
      colors[i * 3] = g * 1.2;
      colors[i * 3 + 1] = g;
      colors[i * 3 + 2] = g * 0.8;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({
      size: 0.4,
      vertexColors: true,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false

    this.cosmicDust = new THREE.Points(geo, mat);
    this.cosmicDust.visible = false;
    this.scene.add(this.cosmicDust);
  }

  createBlackHole() {
    this.blackHoleGroup = new THREE.Group();
    this.blackHoleGroup.position.set(0, 0, -600);
    this.blackHoleGroup.visible = false;

    const discCount = 30000;
    const discGeo = new THREE.BufferGeometry();
    const discPos = new Float32Array(discCount * 3);
    const discColors = new Float32Array(discCount * 3);

    for (let i = 0; i < discCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = 15 + Math.random() * 40;
      discPos[i * 3] = Math.cos(angle) * r;
      discPos[i * 3 + 1] = (Math.random() - 0.5) * 2 * (1 - (r - 15) / 40);
      discPos[i * 3 + 2] = Math.sin(angle) * r;

      const t = (r - 15) / 40;
      discColors[i * 3] = 1.0 - t * 0.5;
      discColors[i * 3 + 1] = 0.6 - t * 0.4;
      discColors[i * 3 + 2] = 0.2;
    }

    discGeo.setAttribute('position', new THREE.BufferAttribute(discPos, 3));
    discGeo.setAttribute('color', new THREE.BufferAttribute(discColors, 3));

    const discMat = new THREE.PointsMaterial({
      size: 0.5,
      vertexColors: true,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    this.blackHoleDisc = new THREE.Points(discGeo, discMat);
    this.blackHoleGroup.add(this.blackHoleDisc);

    const coreGeo = new THREE.SphereGeometry(12, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const core = new THREE.Mesh(coreGeo, coreMat);
    this.blackHoleGroup.add(core);

    const glowGeo = new THREE.RingGeometry(12, 14, 64);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0xffaa44,
      transparent: true,
      opacity: 0.6,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    this.blackHoleGroup.add(glow);

    this.scene.add(this.blackHoleGroup);
  }

  createCosmicTree() {
    this.treeGroup = new THREE.Group();
    this.treeGroup.position.set(300, -50, -500);
    this.treeGroup.visible = false;

    const trunkCount = 5000;
    const trunkGeo = new THREE.BufferGeometry();
    const trunkPos = new Float32Array(trunkCount * 3);
    const trunkColors = new Float32Array(trunkCount * 3);

    for (let i = 0; i < trunkCount; i++) {
      const t = Math.random();
      const y = t * 80;
      const spread = (1 - t) * 8 + t * 3;
      trunkPos[i * 3] = (Math.random() - 0.5) * spread;
      trunkPos[i * 3 + 1] = y;
      trunkPos[i * 3 + 2] = (Math.random() - 0.5) * spread;
      trunkColors[i * 3] = 0.8 + t * 0.2;
      trunkColors[i * 3 + 1] = 0.6 + t * 0.3;
      trunkColors[i * 3 + 2] = 0.2 + t * 0.3;
    }

    trunkGeo.setAttribute('position', new THREE.BufferAttribute(trunkPos, 3));
    trunkGeo.setAttribute('color', new THREE.BufferAttribute(trunkColors, 3));

    const trunkMat = new THREE.PointsMaterial({
      size: 0.6,
      vertexColors: true,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    this.treeGroup.add(new THREE.Points(trunkGeo, trunkMat));

    const branchCount = 20000;
    const branchGeo = new THREE.BufferGeometry();
    const branchPos = new Float32Array(branchCount * 3);
    const branchColors = new Float32Array(branchCount * 3);

    for (let i = 0; i < branchCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 60;
      const y = 40 + Math.random() * 50;
      branchPos[i * 3] = Math.cos(angle) * dist;
      branchPos[i * 3 + 1] = y + (Math.random() - 0.5) * 20;
      branchPos[i * 3 + 2] = Math.sin(angle) * dist;
      const br = Math.random();
      branchColors[i * 3] = 0.6 + br * 0.4;
      branchColors[i * 3 + 1] = 0.5 + br * 0.5;
      branchColors[i * 3 + 2] = 0.8 + br * 0.2;
    }

    branchGeo.setAttribute('position', new THREE.BufferAttribute(branchPos, 3));
    branchGeo.setAttribute('color', new THREE.BufferAttribute(branchColors, 3));

    const branchMat = new THREE.PointsMaterial({
      size: 0.4,
      vertexColors: true,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    this.treeGroup.add(new THREE.Points(branchGeo, branchMat));

    const rootCount = 8000;
    const rootGeo = new THREE.BufferGeometry();
    const rootPos = new Float32Array(rootCount * 3);
    const rootColors = new Float32Array(rootCount * 3);

    for (let i = 0; i < rootCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 40;
      const y = -dist * 0.5;
      rootPos[i * 3] = Math.cos(angle) * dist;
      rootPos[i * 3 + 1] = y;
      rootPos[i * 3 + 2] = Math.sin(angle) * dist;
      rootColors[i * 3] = 0.9;
      rootColors[i * 3 + 1] = 0.7;
      rootColors[i * 3 + 2] = 0.3;
    }

    rootGeo.setAttribute('position', new THREE.BufferAttribute(rootPos, 3));
    rootGeo.setAttribute('color', new THREE.BufferAttribute(rootColors, 3));

    const rootMat = new THREE.PointsMaterial({
      size: 0.3,
      vertexColors: true,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    this.treeGroup.add(new THREE.Points(rootGeo, rootMat));

    this.scene.add(this.treeGroup);
  }

  createGhadaName() {
    this.ghadaNameGroup = new THREE.Group();
    this.ghadaNameGroup.position.set(0, 0, -100);
    this.ghadaNameGroup.visible = false;

    const letters = this.getGhadaLetterPoints();
    const totalCount = letters.length;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(totalCount * 3);
    const origPos = new Float32Array(totalCount * 3);
    const colors = new Float32Array(totalCount * 3);
    const randomPos = new Float32Array(totalCount * 3);

    for (let i = 0; i < totalCount; i++) {
      const lp = letters[i];
      origPos[i * 3] = lp.x;
      origPos[i * 3 + 1] = lp.y;
      origPos[i * 3 + 2] = lp.z;

      const r = 200 + Math.random() * 500;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      randomPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      randomPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      randomPos[i * 3 + 2] = r * Math.cos(phi);

      pos[i * 3] = randomPos[i * 3];
      pos[i * 3 + 1] = randomPos[i * 3 + 1];
      pos[i * 3 + 2] = randomPos[i * 3 + 2];

      const b = 0.7 + Math.random() * 0.3;
      colors[i * 3] = 1.0 * b;
      colors[i * 3 + 1] = 0.85 * b;
      colors[i * 3 + 2] = 0.5 * b;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({
      size: 1.0,
      vertexColors: true,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true
    });

    this.ghadaStars = new THREE.Points(geo, mat);
    this.ghadaStars.userData.origPos = origPos;
    this.ghadaStars.userData.randomPos = randomPos;
    this.ghadaNameGroup.add(this.ghadaStars);

    const lineGeo = new THREE.BufferGeometry();
    const linePos = new Float32Array(200 * 3);
    lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
    const lineMat = new THREE.LineBasicMaterial({
      color: 0xffcc66,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    this.constellationLines = new THREE.LineSegments(lineGeo, lineMat);
    this.ghadaNameGroup.add(this.constellationLines);

    this.scene.add(this.ghadaNameGroup);
  }

  getGhadaLetterPoints() {
    const points = [];
    const scale = 2.5;
    const spacing = 14;
    const startX = -spacing * 2.3;

    const addLetter = (segments, offsetX) => {
      segments.forEach(seg => {
        const steps = 30;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const x = (seg[0] + (seg[2] - seg[0]) * t) * scale + offsetX;
          const y = (seg[1] + (seg[3] - seg[1]) * t) * scale;
          const z = (Math.random() - 0.5) * 2;
          points.push({ x, y, z });
        }
      });
      for (let i = 0; i < 40; i++) {
        const seg = segments[Math.floor(Math.random() * segments.length)];
        const t = Math.random();
        points.push({
          x: (seg[0] + (seg[2] - seg[0]) * t) * scale + offsetX + (Math.random() - 0.5) * 1.5,
          y: (seg[1] + (seg[3] - seg[1]) * t) * scale + (Math.random() - 0.5) * 1.5,
          z: (Math.random() - 0.5) * 3
        });
      }
    };

    // G
    addLetter([
      [2, 4, 1, 4], [1, 4, 0, 3], [0, 3, 0, 1], [0, 1, 1, 0],
      [1, 0, 2, 0], [2, 0, 3, 1], [3, 1, 3, 2], [3, 2, 1.5, 2]
    ], startX);

    // H
    addLetter([
      [0, 0, 0, 4], [3, 0, 3, 4], [0, 2, 3, 2]
    ], startX + spacing);

    // A
    addLetter([
      [0, 0, 1.5, 4], [1.5, 4, 3, 0], [0.6, 1.6, 2.4, 1.6]
    ], startX + spacing * 2);

    // D
    addLetter([
      [0, 0, 0, 4], [0, 4, 2, 4], [2, 4, 3, 3], [3, 3, 3, 1], [3, 1, 2, 0], [2, 0, 0, 0]
    ], startX + spacing * 3);

    // A
    addLetter([
      [0, 0, 1.5, 4], [1.5, 4, 3, 0], [0.6, 1.6, 2.4, 1.6]
    ], startX + spacing * 4);

    return points;
  }

  createCosmicRose() {
    this.roseGroup = new THREE.Group();
    this.roseGroup.position.set(0, 0, -100);
    this.roseGroup.visible = false;

    const petalCount = 20000;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(petalCount * 3);
    const colors = new Float32Array(petalCount * 3);

    for (let i = 0; i < petalCount; i++) {
      const petal = Math.floor(Math.random() * 8);
      const petalAngle = (petal / 8) * Math.PI * 2;
      const r = Math.random() * 20;
      const openAngle = (Math.random() - 0.5) * 0.8;
      const layerOffset = Math.floor(Math.random() * 3) * 0.3;

      pos[i * 3] = Math.cos(petalAngle + openAngle) * r * (0.5 + layerOffset);
      pos[i * 3 + 1] = Math.sin(petalAngle + openAngle) * r * (0.5 + layerOffset) + r * 0.2;
      pos[i * 3 + 2] = (Math.random() - 0.5) * 5 - layerOffset * 5;

      const t = r / 20;
      colors[i * 3] = 0.9 - t * 0.3;
      colors[i * 3 + 1] = 0.3 + t * 0.3;
      colors[i * 3 + 2] = 0.4 + t * 0.2;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({
      size: 0.6,
      vertexColors: true,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    this.roseParticles = new THREE.Points(geo, mat);
    this.roseGroup.add(this.roseParticles);
    this.scene.add(this.roseGroup);
  }

  createCelestialEye() {
    this.eyeGroup = new THREE.Group();
    this.eyeGroup.position.set(0, 0, -200);
    this.eyeGroup.visible = false;

    const irisCount = 15000;
    const irisGeo = new THREE.BufferGeometry();
    const irisPos = new Float32Array(irisCount * 3);
    const irisColors = new Float32Array(irisCount * 3);

    for (let i = 0; i < irisCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = 3 + Math.random() * 25;
      irisPos[i * 3] = Math.cos(angle) * r;
      irisPos[i * 3 + 1] = Math.sin(angle) * r * 0.5;
      irisPos[i * 3 + 2] = (Math.random() - 0.5) * 3;
      const t = r / 25;
      irisColors[i * 3] = 0.2 + t * 0.5;
      irisColors[i * 3 + 1] = 0.4 + t * 0.3;
      irisColors[i * 3 + 2] = 0.8;
    }

    irisGeo.setAttribute('position', new THREE.BufferAttribute(irisPos, 3));
    irisGeo.setAttribute('color', new THREE.BufferAttribute(irisColors, 3));

    const irisMat = new THREE.PointsMaterial({
      size: 0.5,
      vertexColors: true,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    this.eyeIris = new THREE.Points(irisGeo, irisMat);
    this.eyeGroup.add(this.eyeIris);

    const pupilGeo = new THREE.SphereGeometry(3, 32, 32);
    const pupilMat = new THREE.MeshBasicMaterial({
      color: 0x000011,
      transparent: true,
      opacity: 0
    });
    this.eyePupil = new THREE.Mesh(pupilGeo, pupilMat);
    this.eyeGroup.add(this.eyePupil);

    this.scene.add(this.eyeGroup);
  }

  // ═══════════════════════════════════════════════════
  // EXPERIENCE FLOW
  // ═══════════════════════════════════════════════════
  startExperience() {
    if (this.started) return;
    this.started = true;
    this.audio.init();
    document.getElementById('click-hint').style.opacity = '0';
    document.getElementById('mute-btn').style.display = 'flex';
    this.runIntroSequence();
  }

  async runIntroSequence() {
    const delay = (ms) => new Promise(r => setTimeout(r, ms));

    // Phase 1: Single star appears
    await delay(1500);
    this.introStar.material.opacity = 1;
    this.introGlow.material.opacity = 0.3;

    // Heartbeat begins
    let heartbeatCount = 0;
    const heartbeat = setInterval(() => {
      this.audio.playHeartbeat(0.1 + heartbeatCount * 0.01);
      this.introGlow.scale.set(1.3, 1.3, 1.3);
      setTimeout(() => this.introGlow.scale.set(1, 1, 1), 200);
      heartbeatCount++;
    }, 800);

    await delay(2000);

    // Phase 2: Particles appear
    this.introParticles.visible = true;

    await delay(2500);

    // Phase 3: Heartbeat intensifies
    this.introStar.scale.set(2, 2, 2);
    this.introGlow.material.opacity = 0.6;
    this.audio.playTone(220, 3, 0.03);

    await delay(2000);

    // Phase 4: Collapse
    clearInterval(heartbeat);
    this.introStar.scale.set(0.01, 0.01, 0.01);
    this.introGlow.material.opacity = 0;
    this.introParticles.visible = false;
    this.audio.playTone(55, 1, 0.1);

    await delay(800);

    // Phase 5: SUPERNOVA
    this.triggerSupernova();

    await delay(3000);

    // Phase 6: Universe reveals
    this.revealUniverse();
    this.audio.startAmbientDrone();

    await delay(3000);
    this.introComplete = true;
    this.startCinematicJourney();
  }

  triggerSupernova() {
    this.supernovaTriggered = true;
    this.audio.playSupernova();

    this.introStar.scale.set(50, 50, 50);
    this.introGlow.scale.set(200, 200, 200);
    this.introGlow.material.opacity = 1;
    this.introGlow.material.color.set(0xffffff);

    this.bloomPass.strength = 4;
    this.renderer.toneMappingExposure = 3;

    const supernovaParticles = this.createParticleSystem(5000, 100, 0xffeedd);
    this.scene.add(supernovaParticles);

    setTimeout(() => {
      this.bloomPass.strength = 1.5;
      this.renderer.toneMappingExposure = 1;
      this.introStar.visible = false;
      this.scene.remove(supernovaParticles);
    }, 2500);
  }

  revealUniverse() {
    this.starField.visible = true;
    this.deepStars.visible = true;
    this.cosmicDust.visible = true;

    this.nebulae.forEach(n => { n.visible = true; });
    this.cosmicObjects.forEach(g => { g.visible = true; });
    this.planets.forEach(p => { p.visible = true; });

    let opacity = 0;
    const fadeIn = setInterval(() => {
      opacity += 0.01;
      if (opacity >= 1) {
        opacity = 1;
        clearInterval(fadeIn);
      }
      this.starField.material.opacity = opacity;
      this.deepStars.material.opacity = opacity * 0.5;
      this.cosmicDust.material.opacity = opacity * 0.3;
      this.nebulae.forEach(n => { n.material.uniforms.uOpacity.value = opacity * 0.5; });
      this.cosmicObjects.forEach(g => { g.userData.mat.opacity = opacity * 0.7; });
    }, 30);
  }

  async startCinematicJourney() {
    const delay = (ms) => new Promise(r => setTimeout(r, ms));
    const showQuote = (text, duration = 5000) => this.showCinematicText(text, duration);

    // Scene 1: Float through space
    await delay(3000);
    await showQuote("When the universe was born...\nit didn't know it was creating beauty.", 6000);

    // Scene 2: Approach nebula
    await delay(2000);
    this.animateCameraTo(new THREE.Vector3(100, 30, -200), 8000);
    await delay(4000);
    await showQuote("There are places even light\nneeds time to reach.", 5000);

    // Scene 3: Planet flyby
    await delay(2000);
    this.animateCameraTo(new THREE.Vector3(80, 20, -140), 6000);
    this.audio.playChime([392, 494, 587]);
    await delay(3000);
    await showQuote("Every star carries a story.", 4000);

    // Scene 4: Galaxy approach
    await delay(2000);
    this.animateCameraTo(new THREE.Vector3(300, 50, -450), 10000);
    await delay(5000);
    await showQuote("Silence is where\nthe universe speaks.", 5000);

    // Scene 5: Cosmic Tree
    await delay(2000);
    this.treeGroup.visible = true;
    this.animateCameraTo(new THREE.Vector3(300, 30, -450), 8000);
    await delay(4000);
    await showQuote("Some lights shine long after\nthey disappear.", 5000);

    // Scene 6: Cosmic Ocean
    await delay(2000);
    this.oceanGroup.visible = true;
    this.animateCameraTo(new THREE.Vector3(-300, -80, -350), 8000);
    await delay(4000);
    await showQuote("The most beautiful things\nnever ask to be noticed.", 5000);

    // Scene 7: Black Hole
    await delay(2000);
    this.blackHoleGroup.visible = true;
    this.animateCameraTo(new THREE.Vector3(0, 20, -500), 10000);
    await delay(5000);
    await showQuote("Some souls feel strangely familiar...\neven across galaxies.", 6000);

    // Scene 8: Through the black hole
    await delay(2000);
    this.animateCameraTo(new THREE.Vector3(0, 0, -590), 8000);
    this.bloomPass.strength = 2.5;
    await delay(4000);
    await showQuote("There are billions of stars...\nyet sometimes only one\ncaptures your eyes.", 6000);
    this.bloomPass.strength = 1.2;

    // Scene 9: Grand Finale prep
    await delay(3000);
    await showQuote("Some names deserve to be written\nacross the sky.", 5000);

    // Scene 10: GHADA Name Reveal
    await delay(2000);
    this.audio.playFinaleMusic();
    await this.runGrandFinale();

    // Scene 11: Rose
    await delay(3000);
    await this.runRoseSequence();

    // Scene 12: Eye reveal
    await delay(3000);
    await this.runEyeSequence();

    // Final
    await delay(3000);
    await this.runFinalMoment();
  }

  animateCameraTo(target, duration = 5000) {
    const start = this.camera.position.clone();
    const startTime = performance.now();

    const animate = () => {
      const elapsed = performance.now() - startTime;
      const t = Math.min(elapsed / duration, 1);
      const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

      this.camera.position.lerpVectors(start, target, ease);

      if (t < 1) requestAnimationFrame(animate);
    };
    animate();
  }

  showCinematicText(text, duration = 5000) {
    return new Promise(resolve => {
      const el = document.getElementById('cinematic-text');
      el.textContent = '';
      el.style.opacity = '0';

      const lines = text.split('\n');
      el.innerHTML = lines.map(l => `<div>${l}</div>`).join('');

      setTimeout(() => {
        el.style.transition = 'opacity 2s ease';
        el.style.opacity = '1';
      }, 100);

      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(resolve, 2000);
      }, duration);
    });
  }

  async runGrandFinale() {
    this.ghadaNameGroup.visible = true;
    this.animateCameraTo(new THREE.Vector3(0, 5, -60), 5000);

    const positions = this.ghadaStars.geometry.attributes.position.array;
    const origPos = this.ghadaStars.userData.origPos;
    const count = positions.length / 3;

    this.bloomPass.strength = 2;

    return new Promise(resolve => {
      const startTime = performance.now();
      const duration = 8000;

      const animateFormation = () => {
        const elapsed = performance.now() - startTime;
        const t = Math.min(elapsed / duration, 1);
        const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

        for (let i = 0; i < count; i++) {
          const idx = i * 3;
          positions[idx] = positions[idx] + (origPos[idx] - positions[idx]) * ease * 0.05;
          positions[idx + 1] = positions[idx + 1] + (origPos[idx + 1] - positions[idx + 1]) * ease * 0.05;
          positions[idx + 2] = positions[idx + 2] + (origPos[idx + 2] - positions[idx + 2]) * ease * 0.05;
        }
        this.ghadaStars.geometry.attributes.position.needsUpdate = true;

        if (t < 1) {
          requestAnimationFrame(animateFormation);
        } else {
          this.constellationLines.material.opacity = 0.3;
          setTimeout(() => {
            this.bloomPass.strength = 1.2;
            resolve();
          }, 4000);
        }
      };
      animateFormation();
    });
  }

  async runRoseSequence() {
    this.ghadaNameGroup.visible = false;
    this.roseGroup.visible = true;
    this.roseGroup.position.copy(this.camera.position).add(new THREE.Vector3(0, 0, -40));

    this.roseParticles.material.opacity = 0;
    let opacity = 0;

    return new Promise(resolve => {
      const fadeIn = setInterval(() => {
        opacity += 0.01;
        this.roseParticles.material.opacity = opacity;
        this.roseGroup.rotation.y += 0.002;
        if (opacity >= 0.8) {
          clearInterval(fadeIn);
          this.showCinematicText("Some lights don't guide the way...\nthey become the destination.", 5000);
          setTimeout(() => {
            const fadeOut = setInterval(() => {
              opacity -= 0.008;
              this.roseParticles.material.opacity = opacity;
              if (opacity <= 0) {
                clearInterval(fadeOut);
                this.roseGroup.visible = false;
                resolve();
              }
            }, 30);
          }, 5000);
        }
      }, 30);
    });
  }

  async runEyeSequence() {
    this.eyeGroup.visible = true;
    this.eyeGroup.position.copy(this.camera.position).add(new THREE.Vector3(0, 0, -80));

    let openAmount = 0;

    return new Promise(resolve => {
      const openEye = setInterval(() => {
        openAmount += 0.005;
        this.eyeIris.material.opacity = openAmount;
        this.eyePupil.material.opacity = openAmount;

        const scaleY = 0.1 + openAmount * 0.9;
        this.eyeGroup.scale.set(1, scaleY, 1);

        if (openAmount >= 1) {
          clearInterval(openEye);
          setTimeout(() => {
            const closeEye = setInterval(() => {
              openAmount -= 0.008;
              this.eyeIris.material.opacity = openAmount;
              this.eyePupil.material.opacity = openAmount;
              this.eyeGroup.scale.set(1, 0.1 + openAmount * 0.9, 1);

              if (openAmount <= 0) {
                clearInterval(closeEye);
                this.eyeGroup.visible = false;
                resolve();
              }
            }, 30);
          }, 4000);
        }
      }, 20);
    });
  }

  async runFinalMoment() {
    const delay = (ms) => new Promise(r => setTimeout(r, ms));

    this.bloomPass.strength = 0.5;

    // Fade everything
    let fade = 1;
    const fadeOut = setInterval(() => {
      fade -= 0.005;
      this.starField.material.opacity = fade;
      this.deepStars.material.opacity = fade * 0.5;
      if (fade <= 0) clearInterval(fadeOut);
    }, 30);

    await delay(5000);

    // Tiny star appears
    const finalStar = new THREE.Mesh(
      new THREE.SphereGeometry(0.03, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xffeedd })
    );
    finalStar.position.copy(this.camera.position).add(new THREE.Vector3(0, 0, -5));
    this.scene.add(finalStar);

    const finalGlow = new THREE.Mesh(
      new THREE.SphereGeometry(0.1, 16, 16),
      new THREE.MeshBasicMaterial({
        color: 0xffcc88,
        transparent: true,
        opacity: 0.4,
        blending: THREE.AdditiveBlending
      })
    );
    finalStar.add(finalGlow);

    await delay(5000);

    await this.showCinematicText("Even the universe needed billions of years...\n\nto create a star like you.", 7000);

    await delay(2000);

    await this.showCinematicText("G H A D A", 5000);

    await delay(2000);

    // Shooting star
    this.audio.playChime([784, 988, 1175, 1319]);

    await this.showCinematicText("For the brightest star...", 5000);

    await delay(3000);

    // Fade to single star
    await this.showCinematicText("♦", 3000);

    // Click to restart
    const restartHandler = () => {
      window.removeEventListener('click', restartHandler);
      this.scene.remove(finalStar);
      this.restartExperience();
    };
    window.addEventListener('click', restartHandler);
  }

  restartExperience() {
    this.camera.position.set(0, 0, 5);
    this.starField.material.opacity = 0;
    this.deepStars.material.opacity = 0;
    this.introStar.visible = true;
    this.introStar.material.opacity = 0;
    this.introStar.scale.set(1, 1, 1);
    this.ghadaNameGroup.visible = false;
    this.started = false;
    this.introComplete = false;
    this.supernovaTriggered = false;
    document.getElementById('click-hint').style.opacity = '1';
    this.startExperience();
  }

  // ═══════════════════════════════════════════════════
  // ANIMATION LOOP
  // ═══════════════════════════════════════════════════
  animate() {
    requestAnimationFrame(() => this.animate());

    const delta = this.clock.getDelta();
    const elapsed = this.clock.getElapsedTime();

    this.mouseSmooth.lerp(this.mouse, 0.05);

    // Gentle camera sway
    if (this.introComplete) {
      this.camera.rotation.y += (this.mouseSmooth.x * 0.1 - this.camera.rotation.y) * 0.02;
      this.camera.rotation.x += (this.mouseSmooth.y * 0.05 - this.camera.rotation.x) * 0.02;
    }

    // Universe breathing
    this.breathPhase += delta * 0.3;
    const breath = Math.sin(this.breathPhase) * 0.02;

    // Animate stars twinkling
    if (this.starField && this.starField.visible) {
      this.starField.rotation.y += 0.00003;
      this.starField.rotation.x = breath;
    }
    if (this.deepStars && this.deepStars.visible) {
      this.deepStars.rotation.y -= 0.00002;
    }

    // Nebulae animation
    this.nebulae.forEach(n => {
      if (n.visible && n.material.uniforms) {
        n.material.uniforms.uTime.value = elapsed;
      }
    });

    // Planet rotation
    this.planets.forEach((p, i) => {
      if (p.visible) {
        p.rotation.y += 0.001 * (1 + i * 0.2);
      }
    });

    // Galaxy rotation
    this.cosmicObjects.forEach((g, i) => {
      if (g.visible) {
        g.rotation.y += 0.0001 * (1 + i * 0.3);
      }
    });

    // Cosmic dust drift
    if (this.cosmicDust && this.cosmicDust.visible) {
      this.cosmicDust.rotation.y += 0.00005;
    }

    // Black hole disc rotation
    if (this.blackHoleGroup && this.blackHoleGroup.visible && this.blackHoleDisc) {
      this.blackHoleDisc.rotation.y += 0.005;
      this.blackHoleDisc.rotation.z = Math.sin(elapsed * 0.2) * 0.1;
    }

    // Tree sway
    if (this.treeGroup && this.treeGroup.visible) {
      this.treeGroup.rotation.y = Math.sin(elapsed * 0.1) * 0.05;
    }

    // Ocean waves
    if (this.oceanMesh && this.oceanGroup.visible) {
      const positions = this.oceanMesh.geometry.attributes.position.array;
      for (let i = 0; i < positions.length; i += 3) {
        const x = positions[i];
        const z = positions[i + 2];
        positions[i + 1] = Math.sin(x * 0.05 + elapsed * 0.5) * Math.cos(z * 0.05 + elapsed * 0.3) * 2;
      }
      this.oceanMesh.geometry.attributes.position.needsUpdate = true;
    }

    // GHADA name twinkle
    if (this.ghadaNameGroup && this.ghadaNameGroup.visible && this.ghadaStars) {
      this.ghadaNameGroup.rotation.y = Math.sin(elapsed * 0.15) * 0.1;
    }

    // Rose rotation
    if (this.roseGroup && this.roseGroup.visible) {
      this.roseGroup.rotation.y += 0.003;
      this.roseGroup.rotation.z = Math.sin(elapsed * 0.3) * 0.05;
    }

    // Update post-processing
    if (this.chromaticPass) {
      this.chromaticPass.uniforms.uTime.value = elapsed;
    }

    // Render
    this.composer.render();
  }
}

// ═══════════════════════════════════════════════════════
// LAUNCH
// ═══════════════════════════════════════════════════════
const universe = new GhadaUniverse();
universe.init();

</script>
