<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GHADA — A Universe Created For You</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Georgia','Times New Roman',serif;cursor:none;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
#cursor{position:fixed;width:20px;height:20px;border-radius:50%;pointer-events:none;z-index:10000;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,220,150,.9),rgba(255,180,100,.3),transparent 70%);transform:translate(-100px,-100px)}
#cursor-trail{position:fixed;width:40px;height:40px;border-radius:50%;pointer-events:none;z-index:9999;background:radial-gradient(circle,rgba(255,200,100,.12),transparent 70%);transform:translate(-100px,-100px)}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9998;display:flex;align-items:center;justify-content:center;flex-direction:column}
#loading.fade{opacity:0;transition:opacity 2s ease;pointer-events:none}
#loading-text{color:rgba(255,220,180,.5);font-size:13px;letter-spacing:10px;text-transform:uppercase}
#loading-bar{width:200px;height:1px;background:rgba(255,255,255,.07);margin-top:24px;overflow:hidden;border-radius:1px}
#loading-fill{width:0%;height:100%;background:linear-gradient(90deg,rgba(255,200,100,.2),rgba(255,220,150,.7));transition:width .3s ease}
#vignette{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.8) 100%);z-index:99;pointer-events:none}
#cinematic-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:150;color:rgba(255,240,220,0);font-size:clamp(16px,2.5vw,26px);letter-spacing:4px;line-height:2.2;text-align:center;pointer-events:none;white-space:pre-line;text-shadow:0 0 60px rgba(255,200,100,.25),0 0 120px rgba(255,180,100,.1);transition:color 2.5s ease}
#cinematic-text.show{color:rgba(255,240,220,.85)}
#cinematic-text.hide{color:rgba(255,240,220,0)}
#mute-btn{position:fixed;bottom:30px;right:30px;z-index:300;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:rgba(255,255,255,.5);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px;transition:all .4s ease;pointer-events:all}
#mute-btn:hover{border-color:rgba(255,220,150,.3);color:rgba(255,220,150,.7)}
#click-start{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;color:rgba(255,255,255,0);font-size:12px;letter-spacing:6px;pointer-events:none;text-transform:uppercase;transition:color 2s ease}
#click-start.show{color:rgba(255,255,255,.25)}
#click-start.hide{color:rgba(255,255,255,0)}
.trail-particle{position:fixed;width:4px;height:4px;border-radius:50%;pointer-events:none;z-index:9998;background:rgba(255,220,150,.6);mix-blend-mode:screen}
</style>
</head>

</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ═══════════════════════════════════════════════════════
   AUDIO ENGINE — Web Audio API synthesized soundtrack
   ═══════════════════════════════════════════════════════ */
class AudioEngine{
  constructor(){this.ctx=null;this.master=null;this.muted=false;this.nodes=[]}
  init(){
    if(this.ctx)return;
    this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    this.master=this.ctx.createGain();
    this.master.gain.value=0;
    this.master.connect(this.ctx.destination);
    this.fadeIn(0.35,3);
  }
  fadeIn(v,t){this.master.gain.linearRampToValueAtTime(v,this.ctx.currentTime+t)}
  pad(freq,type='sine',gain=0.02,detune=0){
    if(!this.ctx)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=freq;o.detune.value=detune;
    g.gain.value=0;g.gain.linearRampToValueAtTime(gain,this.ctx.currentTime+4);
    o.connect(g);g.connect(this.master);o.start();
    this.nodes.push({o,g});
  }
  heartbeat(intensity=0.12){
    if(!this.ctx)return;
    const n=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine';o.frequency.value=38;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(intensity,n+.04);
    g.gain.exponentialRampToValueAtTime(.001,n+.5);
    o.connect(g);g.connect(this.master);o.start(n);o.stop(n+.6);
    const o2=this.ctx.createOscillator(),g2=this.ctx.createGain();
    o2.type='sine';o2.frequency.value=75;
    g2.gain.setValueAtTime(0,n+.06);g2.gain.linearRampToValueAtTime(intensity*.4,n+.1);
    g2.gain.exponentialRampToValueAtTime(.001,n+.35);
    o2.connect(g2);g2.connect(this.master);o2.start(n);o2.stop(n+.4);
  }
  tone(freq,dur=1.5,gain=.04,type='sine'){
    if(!this.ctx)return;const n=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(gain,n+.08);
    g.gain.exponentialRampToValueAtTime(.001,n+dur);
    o.connect(g);g.connect(this.master);o.start(n);o.stop(n+dur+.1);
  }
  chime(notes,spacing=.18){notes.forEach((f,i)=>setTimeout(()=>this.tone(f,2.5,.035),i*spacing*1000))}
  supernova(){
    if(!this.ctx)return;const n=this.ctx.currentTime;
    const buf=this.ctx.createBuffer(2,this.ctx.sampleRate*5,this.ctx.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(this.ctx.sampleRate*2))}
    const src=this.ctx.createBufferSource();src.buffer=buf;
    const g=this.ctx.createGain(),lp=this.ctx.createBiquadFilter();
    lp.type='lowpass';lp.frequency.setValueAtTime(80,n);lp.frequency.linearRampToValueAtTime(3000,n+.4);lp.frequency.linearRampToValueAtTime(60,n+4);
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.25,n+.2);g.gain.exponentialRampToValueAtTime(.001,n+5);
    src.connect(lp);lp.connect(g);g.connect(this.master);src.start(n);
    this.tone(28,5,.18);this.tone(55,4,.09);this.tone(110,3,.04);
  }
  drone(){
    this.pad(55,'sine',.018);this.pad(55.2,'sine',.012,6);
    this.pad(82.4,'sine',.008);this.pad(110,'triangle',.004,-4);
    this.pad(164.8,'sine',.002);this.pad(220,'sine',.0015,8);
    this.pad(329.6,'sine',.001,3);
  }
  finaleMusic(){
    [261.6,329.6,392,523.3,659.3,784,1047,1319,1047,784,659.3,523.3,392,329.6,261.6].forEach((f,i)=>setTimeout(()=>this.tone(f,4,.035),i*500));
    this.tone(130.8,10,.025);this.tone(196,10,.015);this.tone(65.4,10,.03);
  }
  toggleMute(){this.muted=!this.muted;this.master.gain.linearRampToValueAtTime(this.muted?0:.35,this.ctx.currentTime+.3)}
}

/* ═══════════════════════════════════════════════════════
   CUSTOM SHADERS
   ═══════════════════════════════════════════════════════ */
const STAR_VERT=`
attribute float size;
attribute float brightness;
attribute vec3 customColor;
varying vec3 vColor;
varying float vBrightness;
uniform float uTime;
uniform float uPixelRatio;
void main(){
  vColor=customColor;
  vBrightness=brightness;
  float twinkle=sin(uTime*1.5+position.x*0.01+position.y*0.02)*0.3+0.7;
  vec4 mv=modelViewMatrix*vec4(position,1.0);
  gl_PointSize=size*uPixelRatio*(300.0/length(mv.xyz))*twinkle;
  gl_PointSize=clamp(gl_PointSize,0.5,16.0);
  gl_Position=projectionMatrix*mv;
}`;
const STAR_FRAG=`
varying vec3 vColor;
varying float vBrightness;
void main(){
  vec2 c=gl_PointCoord-0.5;
  float d=length(c);
  if(d>0.5)discard;
  float a=1.0-smoothstep(0.0,0.5,d);
  a=pow(a,1.5);
  float glow=exp(-d*6.0)*0.5;
  gl_FragColor=vec4(vColor*(a+glow)*vBrightness,a*vBrightness);
}`;

const NEBULA_VERT=`
varying vec2 vUv;varying vec3 vPos;
void main(){vUv=uv;vPos=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const NEBULA_FRAG=`
uniform float uTime;uniform vec3 uC1;uniform vec3 uC2;uniform vec3 uC3;uniform float uAlpha;
varying vec2 vUv;varying vec3 vPos;
vec3 mod289(vec3 x){return x-floor(x/289.)*289.;}
vec4 mod289(vec4 x){return x-floor(x/289.)*289.;}
vec4 perm(vec4 x){return mod289(((x*34.)+1.)*x);}
float noise(vec3 p){
  vec3 a=floor(p),d=p-a;a=mod289(a);
  vec4 b=a.xxyy+vec4(0,1,0,1),k1=perm(b.xyxy),k2=perm(k1.xyxy+b.zzww);
  vec4 c2=k2*.0243902+d.zzzz,o1=fract(floor(c2*7.)*.142857)-.5,o2=fract(floor(c2*7.*7.)*.142857)-.5;
  vec4 o3=.5-abs(o1)-abs(o2);
  vec4 h=max(vec4(0),vec4(1)-abs(o1)-abs(o2)-abs(o3));
  return dot(h*h*(3.-2.*h),vec4(dot(vec3(o1.x,o2.x,o3.x)*d,d),dot(vec3(o1.y,o2.y,o3.y)*(d-vec3(1,0,0)),d-vec3(1,0,0)),dot(vec3(o1.z,o2.z,o3.z)*(d-vec3(0,1,0)),d-vec3(0,1,0)),dot(vec3(o1.w,o2.w,o3.w)*(d-vec3(1,1,0)),d-vec3(1,1,0))));
}
void main(){
  float n1=noise(vPos*.25+uTime*.04),n2=noise(vPos*.5+uTime*.06+100.),n3=noise(vPos*1.+uTime*.025+200.);
  float n=(n1+n2*.5+n3*.25)/1.75;n=n*.5+.5;
  vec3 col=mix(uC1,uC2,n);col=mix(col,uC3,n3*.5+.5);
  float edge=smoothstep(0.,.25,vUv.x)*smoothstep(1.,.75,vUv.x)*smoothstep(0.,.25,vUv.y)*smoothstep(1.,.75,vUv.y);
  gl_FragColor=vec4(col,n*edge*uAlpha*.7);
}`;

const CHROMATIC={
  uniforms:{tDiffuse:{value:null},uInt:{value:.003},uTime:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uInt;uniform float uTime;varying vec2 vUv;
  void main(){vec2 d=vUv-.5;float l=length(d);float i=uInt*(1.+sin(uTime*.3)*.15);
  float r=texture2D(tDiffuse,vUv+d*l*i).r;float g=texture2D(tDiffuse,vUv).g;float b=texture2D(tDiffuse,vUv-d*l*i).b;
  gl_FragColor=vec4(r,g,b,1.);}`
};
const VIGNETTE={
  uniforms:{tDiffuse:{value:null},uDark:{value:.65}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uDark;varying vec2 vUv;
  void main(){vec4 c=texture2D(tDiffuse,vUv);vec2 u=(vUv-.5)*2.;float v=1.-dot(u,u)*uDark;
  gl_FragColor=vec4(c.rgb*clamp(v,0.,1.),c.a);}`
};
const FILM_GRAIN={
  uniforms:{tDiffuse:{value:null},uTime:{value:0},uIntensity:{value:.04}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uTime;uniform float uIntensity;varying vec2 vUv;
  float rand(vec2 co){return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453);}
  void main(){vec4 c=texture2D(tDiffuse,vUv);float g=rand(vUv+uTime)*uIntensity;
  gl_FragColor=vec4(c.rgb+g,c.a);}`
};

/* ═══════════════════════════════════════════════════════
   MAIN EXPERIENCE
   ═══════════════════════════════════════════════════════ */
class GhadaUniverse{
  constructor(){
    this.clock=new THREE.Clock();
    this.mouse=new THREE.Vector2();
    this.mouseSmooth=new THREE.Vector2();
    this.audio=new AudioEngine();
    this.W=window.innerWidth;
    this.H=window.innerHeight;
    this.dpr=Math.min(window.devicePixelRatio,1.5);
    this.mobile=/Mobi|Android/i.test(navigator.userAgent);
    this.started=false;
    this.phase='loading';
    this.breathe=0;
    this.camTarget=new THREE.Vector3(0,0,5);
    this.camLookTarget=new THREE.Vector3(0,0,0);
    this.camEase=.015;

    this.quotes=[
      "When the universe was born...\nit didn't know it was creating beauty.",
      "There are places even light\nneeds time to reach.",
      "Every star carries a story.",
      "Silence is where\nthe universe speaks.",
      "Some lights shine long after\nthey disappear.",
      "Infinity is measured by wonder.",
      "The universe remembers\nevery spark.",
      "Not every miracle makes a sound.",
      "There are billions of stars...\nyet sometimes only one\ncaptures your eyes.",
      "The most beautiful things\nnever ask to be noticed.",
      "Some souls feel strangely familiar...\neven across galaxies.",
      "Some lights don't guide the way...\nthey become the destination.",
      "The universe never creates\ntwo identical stars.",
      "Some names deserve to be written\nacross the sky."
    ];
  }

  async boot(){
    this.initRenderer();
    this.initCamera();
    this.scene=new THREE.Scene();
    this.scene.fog=new THREE.FogExp2(0x000008,.00006);
    this.initPostFX();
    this.initEvents();
    this.initCursor();
    await this.build();
    document.getElementById('loading').classList.add('fade');
    setTimeout(()=>{
      const el=document.getElementById('click-start');
      el.classList.add('show');
    },2500);
    this.tick();
  }

  initRenderer(){
    this.renderer=new THREE.WebGLRenderer({antialias:!this.mobile,alpha:false,powerPreference:'high-performance'});
    this.renderer.setSize(this.W,this.H);
    this.renderer.setPixelRatio(this.dpr);
    this.renderer.toneMapping=THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure=1.0;
    this.renderer.outputColorSpace=THREE.SRGBColorSpace;
    document.body.appendChild(this.renderer.domElement);
  }

  initCamera(){
    this.camera=new THREE.PerspectiveCamera(65,this.W/this.H,.1,30000);
    this.camera.position.set(0,0,5);
  }

  initPostFX(){
    this.composer=new EffectComposer(this.renderer);
    this.composer.addPass(new RenderPass(this.scene,this.camera));
    this.bloom=new UnrealBloomPass(new THREE.Vector2(this.W,this.H),.8,.3,.85);
    this.composer.addPass(this.bloom);
    this.chromatic=new ShaderPass(CHROMATIC);
    this.composer.addPass(this.chromatic);
    this.grain=new ShaderPass(FILM_GRAIN);
    this.composer.addPass(this.grain);
    this.vignette=new ShaderPass(VIGNETTE);
    this.composer.addPass(this.vignette);
  }

  initEvents(){
    window.addEventListener('resize',()=>{
      this.W=innerWidth;this.H=innerHeight;
      this.camera.aspect=this.W/this.H;this.camera.updateProjectionMatrix();
      this.renderer.setSize(this.W,this.H);this.composer.setSize(this.W,this.H);
    });
    const onMove=(x,y)=>{this.mouse.x=(x/this.W)*2-1;this.mouse.y=-(y/this.H)*2+1};
    window.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
    window.addEventListener('touchmove',e=>{if(e.touches[0])onMove(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
    window.addEventListener('click',()=>{if(!this.started)this.start()});
    window.addEventListener('touchstart',()=>{if(!this.started)this.start()},{passive:true});
    document.getElementById('mute-btn').addEventListener('click',e=>{
      e.stopPropagation();this.audio.toggleMute();
      e.currentTarget.innerHTML=this.audio.muted?'&#9835;':'&#9834;';
    });
  }

  initCursor(){
    const c=document.getElementById('cursor'),t=document.getElementById('cursor-trail');
    let cx=-100,cy=-100,tx=-100,ty=-100;
    if(this.mobile){c.style.display='none';t.style.display='none';document.body.style.cursor='auto';return}
    document.addEventListener('mousemove',e=>{cx=e.clientX;cy=e.clientY});
    const upd=()=>{
      tx+=(cx-tx)*.12;ty+=(cy-ty)*.12;
      c.style.transform=`translate(${cx-10}px,${cy-10}px)`;
      t.style.transform=`translate(${tx-20}px,${ty-20}px)`;
      requestAnimationFrame(upd);
    };upd();
  }

  setLoading(p){document.getElementById('loading-fill').style.width=p+'%'}

  /* ═══════════════════════════════════════════════════
     BUILD THE ENTIRE UNIVERSE
     ═══════════════════════════════════════════════════ */
  async build(){
    this.setLoading(5);
    this.buildStars();
    this.setLoading(25);
    this.buildNebulae();
    this.setLoading(40);
    this.buildGalaxies();
    this.setLoading(55);
    this.buildPlanets();
    this.setLoading(65);
    this.buildDust();
    this.setLoading(70);
    this.buildBlackHole();
    this.setLoading(75);
    this.buildTree();
    this.setLoading(80);
    this.buildOcean();
    this.setLoading(85);
    this.buildGhadaName();
    this.setLoading(90);
    this.buildRose();
    this.setLoading(93);
    this.buildEye();
    this.setLoading(96);
    this.buildIntroStar();
    this.setLoading(100);

    this.scene.add(new THREE.AmbientLight(0x111128,.15));
  }

  buildStars(){
    const N=this.mobile?120000:320000;
    const pos=new Float32Array(N*3),col=new Float32Array(N*3),sz=new Float32Array(N),br=new Float32Array(N);
    const palette=[
      [1,.97,.94],[1,.9,.77],[1,.84,.4],[.68,.85,.9],[.53,.81,.92],
      [1,.42,.42],[.87,.63,.87],[1,1,1],[1,.88,.7],[.69,.77,.87],
      [.5,.7,1],[1,.6,.3]
    ];
    for(let i=0;i<N;i++){
      const r=20+Math.pow(Math.random(),0.6)*6000;
      const th=Math.random()*Math.PI*2;
      const phi=Math.acos(2*Math.random()-1);
      const diskFactor=Math.exp(-Math.abs(Math.cos(phi))*2);
      const rd=r*(0.3+diskFactor*0.7);
      pos[i*3]=rd*Math.sin(phi)*Math.cos(th);
      pos[i*3+1]=rd*Math.sin(phi)*Math.sin(th)*(0.15+Math.random()*0.25);
      pos[i*3+2]=rd*Math.cos(phi);
      const c=palette[Math.floor(Math.random()*palette.length)];
      const b=0.6+Math.random()*0.4;
      col[i*3]=c[0]*b;col[i*3+1]=c[1]*b;col[i*3+2]=c[2]*b;
      sz[i]=Math.random()<.005?3+Math.random()*5:Math.random()<.05?1.5+Math.random()*2:.5+Math.random()*1;
      br[i]=.5+Math.random()*.5;
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    geo.setAttribute('customColor',new THREE.BufferAttribute(col,3));
    geo.setAttribute('size',new THREE.BufferAttribute(sz,1));
    geo.setAttribute('brightness',new THREE.BufferAttribute(br,1));

    const mat=new THREE.ShaderMaterial({
      vertexShader:STAR_VERT,fragmentShader:STAR_FRAG,
      uniforms:{uTime:{value:0},uPixelRatio:{value:this.dpr}},
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
    });
    this.starField=new THREE.Points(geo,mat);
    this.starField.visible=false;
    this.scene.add(this.starField);
  }

  buildNebulae(){
    this.nebulae=[];
    const cfgs=[
      {p:[150,40,-300],s:300,c1:0x440088,c2:0x880044,c3:0x220066},
      {p:[-250,-80,-500],s:400,c1:0x004488,c2:0x008844,c3:0x002244},
      {p:[400,150,-700],s:450,c1:0x884400,c2:0xbb4400,c3:0x441100},
      {p:[-80,-150,-250],s:250,c1:0x440044,c2:0x880088,c3:0x330033},
      {p:[50,80,-400],s:350,c1:0x004455,c2:0x006677,c3:0x002233},
      {p:[-400,200,-900],s:500,c1:0x220044,c2:0x440088,c3:0x110033},
      {p:[300,-100,-600],s:380,c1:0x664400,c2:0xaa6600,c3:0x332200}
    ];
    cfgs.forEach(c=>{
      const g=new THREE.PlaneGeometry(c.s,c.s,1,1);
      const m=new THREE.ShaderMaterial({
        vertexShader:NEBULA_VERT,fragmentShader:NEBULA_FRAG,
        uniforms:{uTime:{value:0},uC1:{value:new THREE.Color(c.c1)},uC2:{value:new THREE.Color(c.c2)},uC3:{value:new THREE.Color(c.c3)},uAlpha:{value:0}},
        transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending
      });
      const mesh=new THREE.Mesh(g,m);mesh.position.set(...c.p);mesh.lookAt(0,0,0);mesh.visible=false;

  buildGalaxies(){
    this.galaxies=[];
    const make=(pos,count,radius,c1,c2,tilt,arms=4)=>{
      const grp=new THREE.Group();
      const p=new Float32Array(count*3),col=new Float32Array(count*3);
      const co1=new THREE.Color(c1),co2=new THREE.Color(c2);
      for(let i=0;i<count;i++){
        const arm=Math.floor(Math.random()*arms);
        const armA=(arm/arms)*Math.PI*2;
        const dist=Math.pow(Math.random(),.5)*radius;
        const spiral=dist*.004;
        const spread=dist*.12;
        const a=Math.random()*Math.PI*2;
        p[i*3]=Math.cos(a+armA+spiral)*dist+(Math.random()-.5)*spread;
        p[i*3+1]=(Math.random()-.5)*dist*.04;
        p[i*3+2]=Math.sin(a+armA+spiral)*dist+(Math.random()-.5)*spread;
        const t=dist/radius;
        const cc=new THREE.Color().lerpColors(co1,co2,t);
        col[i*3]=cc.r;col[i*3+1]=cc.g;col[i*3+2]=cc.b;
      }
      const geo=new THREE.BufferGeometry();
      geo.setAttribute('position',new THREE.BufferAttribute(p,3));
      geo.setAttribute('color',new THREE.BufferAttribute(col,3));
      const mat=new THREE.PointsMaterial({size:.3,vertexColors:true,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
      grp.add(new THREE.Points(geo,mat));
      grp.position.set(...pos);grp.rotation.x=tilt;grp.visible=false;
      grp.userData.mat=mat;
      this.scene.add(grp);this.galaxies.push(grp);
      return grp;
    };
    make([2000,200,-5000],this.mobile?8000:20000,300,0xffcc88,0x5599ff,.5);
    make([-2500,400,-6000],this.mobile?6000:15000,250,0xff8866,0x9977ff,-.35,3);
    make([500,-1000,-7000],this.mobile?10000:25000,400,0xffddaa,0x77bbff,.75,5);
    make([3000,500,-9000],this.mobile?5000:12000,200,0xffaa88,0xaa88ff,1.2);
  }

  buildTree(){

  buildGhadaName(){

    for(let i=0;i<N;i++){

      scattered[i*3]=r*Math.sin(ph)*Math.cos(th);scattered[i*3+1]=r*Math.sin(ph)*Math.sin(th);scattered[i*3+2]=r*Math.cos(ph);
      pos[i*3]=scattered[i*3];pos[i*3+1]=scattered[i*3+1];pos[i*3+2]=scattered[i*3+2];
      const b=.7+Math.random()*.3;col[i*3]=b;col[i*3+1]=b*.85;col[i*3+2]=b*.5;

  }

  _ghadaPoints(){
    const pts=[];const sc=3;const sp=16;const sx=-sp*2.3;
    const letter=(segs,ox)=>{
      segs.forEach(s=>{
        const steps=35;
        for(let i=0;i<=steps;i++){
          const t=i/steps;
          pts.push({x:(s[0]+(s[2]-s[0])*t)*sc+ox,y:(s[1]+(s[3]-s[1])*t)*sc,z:(Math.random()-.5)*2.5});
        }
      });
      for(let i=0;i<60;i++){
        const s=segs[Math.floor(Math.random()*segs.length)];const t=Math.random();
        pts.push({x:(s[0]+(s[2]-s[0])*t)*sc+ox+(Math.random()-.5)*2,y:(s[1]+(s[3]-s[1])*t)*sc+(Math.random()-.5)*2,z:(Math.random()-.5)*4});
      }
    };
    letter([[2,4,1,4],[1,4,0,3],[0,3,0,1],[0,1,1,0],[1,0,2,0],[2,0,3,1],[3,1,3,2],[3,2,1.5,2]],sx);
    letter([[0,0,0,4],[3,0,3,4],[0,2,3,2]],sx+sp);
    letter([[0,0,1.5,4],[1.5,4,3,0],[.6,1.6,2.4,1.6]],sx+sp*2);
    letter([[0,0,0,4],[0,4,2,4],[2,4,3,3],[3,3,3,1],[3,1,2,0],[2,0,0,0]],sx+sp*3);
    letter([[0,0,1.5,4],[1.5,4,3,0],[.6,1.6,2.4,1.6]],sx+sp*4);
    return pts;
  }

  /* ═══════════════════════════════════════════════════
     EXPERIENCE ORCHESTRATION
     ═══════════════════════════════════════════════════ */
  start(){
    if(this.started)return;this.started=true;this.audio.init();
    document.getElementById('click-start').classList.replace('show','hide');
    document.getElementById('mute-btn').style.display='flex';
    this.runIntro();
  }

  wait(ms){return new Promise(r=>setTimeout(r,ms))}

  showText(text,dur=5000){
    const el=document.getElementById('cinematic-text');
    el.textContent='';
    el.innerHTML=text.split('\n').map(l=>`<div>${l}</div>`).join('');
    el.classList.remove('hide');el.classList.add('show');
    return new Promise(r=>{
      setTimeout(()=>{el.classList.replace('show','hide');setTimeout(r,2500)},dur);
    });
  }

  moveCam(target,look,dur=6000){
    const start=this.camera.position.clone();
    const startLook=this.camLookTarget.clone();
    const t0=performance.now();
    return new Promise(r=>{
      const go=()=>{
        const t=Math.min((performance.now()-t0)/dur,1);
        const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
        this.camera.position.lerpVectors(start,target,e);
        this.camLookTarget.lerpVectors(startLook,look||target,e);
        if(t<1)requestAnimationFrame(go);else r();
      };go();
    });
  }

  fadeObj(obj,propPath,from,to,dur=2000){
    const t0=performance.now();
    return new Promise(r=>{
      const go=()=>{
        const t=Math.min((performance.now()-t0)/dur,1);
        const e=t*t*(3-2*t);
        const v=from+(to-from)*e;
        const parts=propPath.split('.');
        let o=obj;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];
        o[parts[parts.length-1]]=v;
        if(t<1)requestAnimationFrame(go);else r();
      };go();
    });
  }

  async runIntro(){
    this.phase='intro';
    await this.wait(1800);

    this.introStar.material.opacity=1;
    this.introGlow.material.opacity=.4;

    let beatCount=0;
    const hb=setInterval(()=>{
      this.audio.heartbeat(.08+beatCount*.008);
      this.introGlow.scale.setScalar(1.4);
      setTimeout(()=>this.introGlow.scale.setScalar(1),180);
      beatCount++;
    },780);

    await this.wait(2500);
    this.introStar.scale.setScalar(1.8);
    this.introGlow.material.opacity=.6;

    await this.wait(2000);
    this.introStar.scale.setScalar(3);
    this.audio.tone(220,3,.025);

    await this.wait(2000);
    clearInterval(hb);
    this.introStar.scale.setScalar(.01);this.introGlow.material.opacity=0;
    this.audio.tone(50,1,.08);
    await this.wait(600);

    // SUPERNOVA
    this.audio.supernova();
    this.introStar.scale.setScalar(80);
    this.introGlow.scale.setScalar(300);this.introGlow.material.opacity=1;this.introGlow.material.color.set(0xffffff);
    this.bloom.strength=3;this.bloom.threshold=.1;this.renderer.toneMappingExposure=3;

    await this.wait(600);
    this.bloom.strength=2;this.renderer.toneMappingExposure=1.8;
    await this.wait(1000);
    this.bloom.strength=1;this.renderer.toneMappingExposure=1.1;this.bloom.threshold=.5;
    await this.wait(1000);
    this.introStar.visible=false;
    this.bloom.strength=.8;this.bloom.threshold=.85;this.renderer.toneMappingExposure=1;

    // Reveal universe
    this.starField.visible=true;this.dust.visible=true;
    this.nebulae.forEach(n=>{n.visible=true});
    this.galaxies.forEach(g=>{g.visible=true});
    this.planets.forEach(p=>{p.visible=true});

    this.fadeObj(this.starField,'material.uniforms.uPixelRatio.value',0,this.dpr,4000);
    // Stars are controlled by shader, just need the uniform working
    // Fade in nebulae
    this.nebulae.forEach(n=>this.fadeObj(n,'material.uniforms.uAlpha.value',0,.3,5000));
    this.galaxies.forEach(g=>this.fadeObj(g,'userData.mat.opacity',0,.15,5000));
    this.fadeObj(this.dust,'material.opacity',0,.35,5000);

    this.audio.drone();

    await this.wait(3500);
    this.phase='journey';
    this.runJourney();
  }

  async runJourney(){
    const Q=this.quotes;

    // Float through space
    await this.wait(2000);
    await this.showText(Q[0],6500);

    // Approach nebula
    await this.moveCam(new THREE.Vector3(80,25,-180),new THREE.Vector3(150,40,-300),8000);
    await this.showText(Q[1],5500);
    this.audio.chime([392,494,587]);

    // Planet flyby
    await this.moveCam(new THREE.Vector3(70,12,-130),new THREE.Vector3(80,15,-140),7000);
    await this.showText(Q[2],4500);

    // Galaxy approach
    await this.moveCam(new THREE.Vector3(250,40,-400),new THREE.Vector3(350,30,-500),9000);
    await this.showText(Q[3],5500);
    this.audio.chime([523,659,784]);

    // Deeper into space
    await this.moveCam(new THREE.Vector3(150,0,-350),new THREE.Vector3(0,0,-500),8000);
    await this.showText(Q[4],5500);

    // Cosmic Tree
    this.treeGroup.visible=true;
    await this.moveCam(new THREE.Vector3(280,20,-440),new THREE.Vector3(300,-10,-500),8000);
    await this.showText(Q[5],5000);
    this.audio.chime([659,784,988]);

    // Cosmic Ocean
    this.oceanGroup.visible=true;
    await this.moveCam(new THREE.Vector3(-280,-70,-340),new THREE.Vector3(-300,-100,-400),8000);
    await this.showText(Q[9],5500);

    // Approach Black Hole
    this.bhGroup.visible=true;
    await this.moveCam(new THREE.Vector3(0,15,-480),new THREE.Vector3(0,0,-600),10000);
    await this.showText(Q[10],6000);
    this.audio.tone(55,5,.06);

    // Through the Black Hole
    this.bloom.strength=1.5;this.bloom.threshold=.5;
    await this.moveCam(new THREE.Vector3(0,0,-580),new THREE.Vector3(0,0,-600),7000);
    await this.showText(Q[8],6500);
    this.bloom.strength=.8;this.bloom.threshold=.85;

    // Pre-finale
    await this.moveCam(new THREE.Vector3(0,5,-200),new THREE.Vector3(0,0,-100),6000);
    await this.showText(Q[13],6000);
    this.audio.chime([784,988,1175,1319]);

    // GRAND FINALE
    await this.wait(2000);
    this.audio.finaleMusic();
    await this.runFinale();

    // Rose
    await this.wait(3000);
    await this.runRose();

    // Eye
    await this.wait(3000);
    await this.runEye();

    // Final moment
    await this.wait(3000);
    await this.runFinal();
  }

  async runFinale(){
    this.nameGroup.visible=true;
    this.bloom.strength=1.5;this.bloom.threshold=.4;

    const posArr=this.nameStars.geometry.attributes.position.array;
    const orig=this.nameStars._orig;
    const N=posArr.length/3;
    const dur=10000;const t0=performance.now();

    await this.moveCam(new THREE.Vector3(0,6,-58),new THREE.Vector3(0,5,-100),5000);

    await new Promise(r=>{
      const go=()=>{
        const t=Math.min((performance.now()-t0)/dur,1);
        const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
        for(let i=0;i<N;i++){
          const j=i*3;
          posArr[j]+=(orig[j]-posArr[j])*e*.04;
          posArr[j+1]+=(orig[j+1]-posArr[j+1])*e*.04;
          posArr[j+2]+=(orig[j+2]-posArr[j+2])*e*.04;
        }
        this.nameStars.geometry.attributes.position.needsUpdate=true;
        if(t<1)requestAnimationFrame(go);else{
          for(let i=0;i<N;i++){const j=i*3;posArr[j]=orig[j];posArr[j+1]=orig[j+1];posArr[j+2]=orig[j+2]}
          this.nameStars.geometry.attributes.position.needsUpdate=true;
          r();
        }
      };go();
    });

    await this.wait(5000);
    this.bloom.strength=.8;this.bloom.threshold=.85;
  }

  async runRose(){
    this.nameGroup.visible=false;
    this.roseGroup.visible=true;
    this.roseGroup.position.copy(this.camera.position).add(new THREE.Vector3(0,0,-45));

    await this.fadeObj(this.rosePts,'material.opacity',0,.85,3000);
    await this.showText(Q11(),5500);
    await this.fadeObj(this.rosePts,'material.opacity',.85,0,3000);
    this.roseGroup.visible=false;

    function Q11(){return"Some lights don't guide the way...\nthey become the destination."}
  }

  async runEye(){
    this.eyeGroup.visible=true;
    this.eyeGroup.position.copy(this.camera.position).add(new THREE.Vector3(0,0,-80));
    this.eyeGroup.scale.set(1,.05,1);

    const dur=3000;const t0=performance.now();
    await new Promise(r=>{
      const go=()=>{
        const t=Math.min((performance.now()-t0)/dur,1);
        const e=t*t*(3-2*t);
        this.eyeIris.material.opacity=e;this.eyePupil.material.opacity=e;
        this.eyeGroup.scale.set(1,.05+e*.95,1);
        if(t<1)requestAnimationFrame(go);else r();
      };go();
    });

    await this.wait(4000);

    const dur2=2500;const t1=performance.now();
    await new Promise(r=>{
      const go=()=>{
        const t=Math.min((performance.now()-t1)/dur2,1);
        const e=1-t*t;
        this.eyeIris.material.opacity=e;this.eyePupil.material.opacity=e;
        this.eyeGroup.scale.set(1,.05+e*.95,1);
        if(t<1)requestAnimationFrame(go);else r();
      };go();
    });
    this.eyeGroup.visible=false;
  }

  async runFinal(){
    this.bloom.strength=.5;this.bloom.threshold=.85;

    // Fade stars
    this.fadeObj(this.dust,'material.opacity',.35,0,4000);
    this.nebulae.forEach(n=>this.fadeObj(n,'material.uniforms.uAlpha.value',.3,0,4000));
    this.galaxies.forEach(g=>this.fadeObj(g,'userData.mat.opacity',.15,0,4000));
    this.planets.forEach(p=>{p.visible=false});
    this.treeGroup.visible=false;this.oceanGroup.visible=false;this.bhGroup.visible=false;

    await this.wait(5000);

    // Tiny last star
    const lastStar=new THREE.Mesh(new THREE.SphereGeometry(.04,16,16),new THREE.MeshBasicMaterial({color:0xffeedd}));
    lastStar.position.copy(this.camera.position).add(new THREE.Vector3(0,0,-6));
    const lastGlow=new THREE.Mesh(new THREE.SphereGeometry(.12,16,16),new THREE.MeshBasicMaterial({color:0xffcc88,transparent:true,opacity:.5,blending:THREE.AdditiveBlending}));
    lastStar.add(lastGlow);
    this.scene.add(lastStar);

    await this.wait(5000);
    await this.showText("Even the universe needed billions of years...\n\nto create a star like you.",7500);
    await this.wait(1500);
    await this.showText("G  H  A  D  A",5500);
    this.audio.chime([784,988,1175,1319,1568]);
    await this.wait(2000);
    await this.showText("For the brightest star...",5000);
    await this.wait(3000);

    this.scene.remove(lastStar);
    const restartStar=new THREE.Mesh(new THREE.SphereGeometry(.03,16,16),new THREE.MeshBasicMaterial({color:0xffeedd}));
    restartStar.position.copy(this.camera.position).add(new THREE.Vector3(0,0,-5));
    const rGlow=new THREE.Mesh(new THREE.SphereGeometry(.08,16,16),new THREE.MeshBasicMaterial({color:0xffcc88,transparent:true,opacity:.4,blending:THREE.AdditiveBlending}));
    restartStar.add(rGlow);
    this.scene.add(restartStar);

    const handler=()=>{
      window.removeEventListener('click',handler);
      window.removeEventListener('touchstart',handler);
      this.scene.remove(restartStar);
      this.restart();
    };
    window.addEventListener('click',handler);
    window.addEventListener('touchstart',handler);
  }

  restart(){
    this.camera.position.set(0,0,5);
    this.camLookTarget.set(0,0,0);
    this.starField.visible=false;
    this.dust.visible=false;
    this.nebulae.forEach(n=>{n.visible=false;n.material.uniforms.uAlpha.value=0});
    this.galaxies.forEach(g=>{g.visible=false;g.userData.mat.opacity=0});
    this.planets.forEach(p=>{p.visible=false});
    this.treeGroup.visible=false;this.oceanGroup.visible=false;this.bhGroup.visible=false;
    this.nameGroup.visible=false;this.roseGroup.visible=false;this.eyeGroup.visible=false;

    this.introStar.visible=true;this.introStar.material.opacity=0;this.introStar.scale.setScalar(1);
    this.introGlow.material.opacity=0;this.introGlow.material.color.set(0xffcc88);this.introGlow.scale.setScalar(1);

    const posArr=this.nameStars.geometry.attributes.position.array;
    const scat=this.nameStars._scattered;
    for(let i=0;i<posArr.length;i++)posArr[i]=scat[i];
    this.nameStars.geometry.attributes.position.needsUpdate=true;

    this.bloom.strength=.8;this.bloom.threshold=.85;this.renderer.toneMappingExposure=1;
    this.started=false;
    document.getElementById('click-start').classList.replace('hide','show');
    this.phase='waiting';
  }

  /* ═══════════════════════════════════════════════════
     RENDER LOOP
     ═══════════════════════════════════════════════════ */
  tick(){
    requestAnimationFrame(()=>this.tick());
    const dt=this.clock.getDelta();
    const t=this.clock.getElapsedTime();
    this.mouseSmooth.lerp(this.mouse,.04);
    this.breathe+=dt*.25;
    const breath=Math.sin(this.breathe)*.015;

    if(this.phase==='journey'||this.phase==='finale'){
      this.camera.rotation.y+=(this.mouseSmooth.x*.08-this.camera.rotation.y)*.015;
      this.camera.rotation.x+=(this.mouseSmooth.y*.04-this.camera.rotation.x)*.015;
    }

    if(this.starField&&this.starField.visible){
      this.starField.material.uniforms.uTime.value=t;
      this.starField.rotation.y+=.000025;
      this.starField.rotation.x=breath;
    }
    this.nebulae?.forEach(n=>{if(n.visible)n.material.uniforms.uTime.value=t});
    this.galaxies?.forEach((g,i)=>{if(g.visible)g.rotation.y+=.00008*(1+i*.3)});
    this.planets?.forEach((p,i)=>{if(p.visible)p.rotation.y+=.0008*(1+i*.15)});
    if(this.dust?.visible)this.dust.rotation.y+=.00004;
    if(this.bhGroup?.visible&&this.bhDisc){this.bhDisc.rotation.y+=.004;this.bhDisc.rotation.z=Math.sin(t*.2)*.08}
    if(this.treeGroup?.visible)this.treeGroup.rotation.y=Math.sin(t*.08)*.04;
    if(this.oceanGeo&&this.oceanGroup?.visible){
      const p=this.oceanGeo.attributes.position.array;
      for(let i=0;i<p.length;i+=3)p[i+1]=Math.sin(p[i]*.04+t*.4)*Math.cos(p[i+2]*.04+t*.25)*2.5;
      this.oceanGeo.attributes.position.needsUpdate=true;
    }
    if(this.nameGroup?.visible)this.nameGroup.rotation.y=Math.sin(t*.12)*.08;
    if(this.roseGroup?.visible){this.roseGroup.rotation.y+=.002;this.roseGroup.rotation.z=Math.sin(t*.25)*.04}

    if(this.chromatic)this.chromatic.uniforms.uTime.value=t;
    if(this.grain)this.grain.uniforms.uTime.value=t;

    this.composer.render();
  }
}

const u=new GhadaUniverse();
u.boot();
